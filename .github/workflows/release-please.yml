name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITOPS_PROMOTION_TOKEN || secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          release-type: python

      - name: Enable Auto-Merge or Merge for Release PR
        if: ${{ steps.release.outputs.pr }}
        run: |
          gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --auto --merge --repo "${{ github.repository }}" || \
          gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --admin --merge --repo "${{ github.repository }}" || \
          gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --merge --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PROMOTION_TOKEN || secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

