[package]
name = "coreason-manifest"
version = "0.0.0"
edition = "2021"
description = "Rust bindings for the CoReason Hollow Data Plane."
license-file = "LICENSE"
repository = "https://github.com/CoReason-AI/coreason-manifest"
homepage = "https://github.com/CoReason-AI/coreason-manifest"
documentation = "https://github.com/CoReason-AI/coreason-manifest"
authors = ["CoReason, Inc <license@coreason.ai>"]
categories = ["data-structures", "encoding"]
keywords = ["coreason", "ontology", "pydantic", "schema", "zero-trust"]
readme = "../../README.md"
include = ["src/**/*", "Cargo.toml", "LICENSE", "NOTICE"]

[lib]
name = "coreason_manifest_rust"
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = []
pyo3 = ["dep:pyo3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regress = "0.11.1"
sha2 = "0.10.8"
base64 = "0.22.1"
hex = "0.4.3"
url = "2.5.4"
pyo3 = { version = "0.24.1", features = ["extension-module"], optional = true }
